name: CI/CD Check

on:
  repository_dispatch:
    types: [moonshot_main_commit]
  workflow_dispatch:

jobs:
  deploy-test:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Test Deployment
        run: curl -s -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"

      - name: Wait for Vercel Test Deployment to complete
        run: |
          echo "Waiting 15s for Vercel to register the new test build..."
          sleep 15
          
          for i in {1..30}; do
            STATUS=$(curl -s -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
              "https://api.vercel.com/v6/deployments?projectId=${{ secrets.VERCEL_PROJECT_ID }}&limit=1" \
              | grep -o '"readyState":"[^"]*"' | head -n 1 | cut -d'"' -f4)
            
            echo "Attempt $i - Vercel Status: $STATUS"
            
            if [ "$STATUS" = "READY" ]; then
              echo "Deployment finished successfully!"
              exit 0
            elif [ "$STATUS" = "ERROR" ] || [ "$STATUS" = "CANCELED" ]; then
              echo "Deployment failed or was canceled."
              exit 1
            fi
            
            sleep 10
          done
          
          echo "Error: Deployment timed out after 5 minutes."
          exit 1

  api-tests:
    needs: deploy-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright test --project=api-tests --workers=1 --retries=1 --reporter=list,html
        env:
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-api
          path: playwright-report/
          retention-days: 30

  ui-tests:
    needs: deploy-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright test --project=ui-tests --workers=1 --retries=1 --timeout=15000 --reporter=list,html
        env:
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
          USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-ui
          path: playwright-report/
          retention-days: 30

  deploy-prod:
    needs: [api-tests, ui-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Production Deployment
        run: curl -s -X POST "${{ secrets.VERCEL_PROD_DEPLOY_HOOK }}"

      - name: Wait for Vercel Production Deployment to complete
        run: |
          echo "Waiting 30s for Vercel to register the new build..."
          sleep 30
          
          for i in {1..30}; do
            STATUS=$(curl -s -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
              "https://api.vercel.com/v6/deployments?projectId=${{ secrets.VERCEL_PROJECT_ID }}&target=production&limit=1" \
              | grep -o '"readyState":"[^"]*"' | head -n 1 | cut -d'"' -f4)
            
            echo "Attempt $i - Vercel Status: $STATUS"
            
            if [ "$STATUS" = "READY" ]; then
              echo "Deployment finished successfully!"
              exit 0
            elif [ "$STATUS" = "ERROR" ] || [ "$STATUS" = "CANCELED" ]; then
              echo "Deployment failed or was canceled."
              exit 1
            fi
            
            sleep 10
          done
          
          echo "Error: Deployment timed out after 5 minutes."
          exit 1

  smoke-tests-prod:
    needs: deploy-prod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      
      - name: Run Production Smoke Test
        run: npx playwright test E2E-tests/tests/API/customers.spec.ts --project=api-tests --grep "@smoke" --workers=1 --retries=1 --reporter=list,html
        env:
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-smoke-prod
          path: playwright-report/
          retention-days: 30